services:
  postgres:
    image: postgres:16
    container_name: aicontrol-postgres
    environment:
      POSTGRES_DB: aicontrol
      POSTGRES_USER: aicontrol_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: